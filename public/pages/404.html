<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена | Mone Drop</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/icons.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 50%, #0f1419 100%);
            position: relative;
            overflow: hidden;
        }

        .error-page::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://abrakadabra.fun/uploads/posts/2022-02/1644388951_13-abrakadabra-fun-p-zadnii-fon-dlya-saita-13.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .error-container {
            text-align: center;
            z-index: 1;
            position: relative;
            padding: 40px;
        }

        .error-code {
            font-size: 10em;
            font-weight: 900;
            color: #ff6b00;
            text-shadow: 0 0 40px rgba(255, 107, 0, 0.6);
            margin: 0;
            line-height: 1;
            animation: errorPulse 2s infinite;
        }

        @keyframes errorPulse {
            0%, 100% { 
                text-shadow: 0 0 40px rgba(255, 107, 0, 0.6);
                transform: scale(1);
            }
            50% { 
                text-shadow: 0 0 60px rgba(255, 107, 0, 0.9);
                transform: scale(1.05);
            }
        }

        .error-title {
            font-size: 2.5em;
            color: #fff;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .error-message {
            font-size: 1.3em;
            color: #8892a0;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .error-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .error-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-btn {
            padding: 15px 40px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .error-btn.primary {
            background: linear-gradient(135deg, #ff6b00, #ff8c00);
            color: #000;
            border: 2px solid #ff6b00;
        }

        .error-btn.primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.5);
        }

        .error-btn.secondary {
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.1), rgba(255, 140, 0, 0.05));
            color: #fff;
            border: 2px solid #ff6b00;
        }

        .error-btn.secondary:hover {
            background: linear-gradient(135deg, #ff6b00, #ff8c00);
            color: #000;
            transform: translateY(-3px);
        }

        .error-decoration {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 3px solid rgba(255, 107, 0, 0.1);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }

        .error-decoration:nth-child(1) {
            top: 10%;
            left: 10%;
        }

        .error-decoration:nth-child(2) {
            bottom: 10%;
            right: 10%;
            animation-direction: reverse;
            animation-duration: 25s;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
    </style>
</head>
<body>
    <!-- SVG Sprite -->
<svg style="display: none;">
    <symbol id="icon-upgrade" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="12" fill="#FFC107"/>
        <path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z" fill="#000"/>
    </symbol>
    <symbol id="icon-cases" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="12" fill="#FFC107"/>
        <path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z" fill="#000"/>
    </symbol>
    <symbol id="icon-shop" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="12" fill="#FFC107"/>
        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" fill="#000"/>
    </symbol>
</svg>
    <div class="error-page">
        <div class="error-decoration"></div>
        <div class="error-decoration"></div>
        
        <div class="error-container">
            <div class="error-icon"></div>
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Страница не найдена</h2>
            <p class="error-message">
                Похоже, вы заблудились в лабиринте скинов. 
                Запрашиваемая страница исчезла быстрее, чем редкий нож в кейсе!
            </p>
            <div class="error-buttons">
                <a href="/" class="error-btn primary">На главную</a>
                <a href="/cases" class="error-btn secondary">Открыть кейсы</a>
            </div>
        </div>
    </div>
</body>
</html>
