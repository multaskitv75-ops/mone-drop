<html lang="ru">
<head>

    <style>
        .cases-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .cases-section {
            margin-bottom: 60px;

        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ff6b00;

        .section-title {
            font-size: 2em;
            color: #fff;
            text-transform: uppercase;
            font-weight: bold;
        }

        .section-badge {

     .case-card {
    background: rgba(15, 20, 25, 0.8);
    border: 2px solid #2a3f54;
    border-radius: 15px;
    padding: 0; /* Убираем отступы */
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 280px; /* Фиксированная высота */
}

.case-card:hover {
    transform: translateY(-5px);
    border-color: #ff6b00;
    box-shadow: 0 10px 30px rgba(255, 107, 0, 0.3);
}

/* Картинка на весь фон карточки */
.case-image {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
}

.case-img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Заполняет весь блок */
    transition: transform 0.3s;
}

.case-card:hover .case-img {
    transform: scale(1.05);
}

/* Затемнение поверх картинки для читаемости текста */
.case-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.3) 0%,
        rgba(0, 0, 0, 0.1) 50%,
        rgba(0, 0, 0, 0.7) 100%

    z-index: 2;
}

/* Название кейса поверх картинки */
.case-name {
    position: absolute;
    top: 15px;
    left: 0;
    right: 0;
    font-size: 1.1em;
    color: #fff;
    font-weight: bold;
    text-transform: uppercase;
    z-index: 3;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    padding: 0 10px;
}

/* Бейдж скидки */
.case-sale-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: linear-gradient(135deg, #ff4444, #cc0000);
    color: #fff;
    padding: 4px 8px;
    border-radius: 8px;
    font-size: 0.75em;
    font-weight: bold;
    z-index: 4;
}

/* Информация о предметах */
.case-info {
    position: absolute;
    bottom: 45px;
    left: 0;
    right: 0;
    font-size: 0.8em;
    color: #fff;
    z-index: 3;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
}

/* Цена в правом нижнем углу */
.case-price {
    position: absolute;
    bottom: 12px;
    right: 15px;
    font-size: 1em;
    color: #ff6b00;
    font-weight: bold;
    background: rgba(0, 0, 0, 0.6);
    padding: 6px 12px;
    border-radius: 8px;
    z-index: 3;
    text-shadow: none;
}

.case-old-price {
    position: absolute;
    bottom: 42px;
    right: 15px;
    font-size: 0.75em;
    color: #ccc;
    text-decoration: line-through;
    z-index: 3;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
}
.logo-image {
    height: 60px;
    width: auto;
    object-fit: contain;
}

.logo-section {
    display: flex;
    align-items: center;
    gap: 10px;
}
/* Маскот на заднем плане - большой, частично за кейсами */
.mascot-container {
    position: fixed;
    top: 50%;
    left: 92%; /* Сдвинут правее - часть за кейсами, часть справа */
    transform: translate(-50%, -50%);
    width: 1000px; /* Ещё больше */
    flex-shrink: 0;
    opacity: 1;
    transition: opacity 0.5s ease;
    z-index: 0;
    pointer-events: none;
}

/* Маскот на заднем плане с размытыми краями */
.mascot-container {
    position: fixed;
    top: 50%;
    left: 92%;
    transform: translate(-50%, -50%);
    width: 1000px;
    flex-shrink: 0;
    opacity: 1;
    transition: opacity 0.5s ease;
    z-index: 0;
    pointer-events: none;
    /* Размытие краёв через маску */
    -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 70%);
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 70%);
}

.mascot-image {
    width: 100%;
    height: auto;
    max-height: 900px;
    object-fit: contain;
    /* Свечение вокруг маскота */
    filter: drop-shadow(0 0 40px rgba(255, 107, 0, 0.5)) 
            drop-shadow(0 0 80px rgba(255, 107, 0, 0.3));
    /* Новая анимация */
    animation: mascotFloat 4s ease-in-out infinite;
}

/* Новая анимация - плавное покачивание + лёгкое вращение */
@keyframes mascotFloat {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    25% {
        transform: translateY(-15px) rotate(1deg);
    }
    50% {
        transform: translateY(-25px) rotate(0deg);
    }
    75% {
        transform: translateY(-15px) rotate(-1deg);
    }
}

.case-card::after {

    top: -2px;

    background: linear-gradient(45deg, #ff6b00, #ff8c00, #ff6b00);

    z-index: -1;
    transition: opacity 0.3s;
    filter: blur(10px);

.case-card:hover::after {

}

.case-card:hover {

/* Старая цена */
.case-old-price {
    position: absolute;

        /* Секция промо */
.promo-section {
    max-width: 1600px;
    margin: 0 auto 40px;
    padding: 30px 20px;
}

/* Заголовок Mone Drop */
.promo-header {
    text-align: center;
    margin-bottom: 30px;
}

.main-title {
    font-size: 4em;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 3px;
    display: inline-flex;
    gap: 10px;
    text-shadow: 
        0 0 20px rgba(255, 107, 0, 0.8),
        0 0 40px rgba(255, 107, 0, 0.5),
        0 0 60px rgba(255, 107, 0, 0.3);
    animation: titleGlow 3s ease-in-out infinite;
}

.title-mone {
    color: #fff;
}

.title-drop {
    background: linear-gradient(135deg, #ff6b00, #ff8c00, #ff6b00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    position: relative;
}

@keyframes titleGlow {
    0%, 100% {
        filter: brightness(1);
    }
    50% {
        filter: brightness(1.2);
    }
}

/* Контент промо */
.promo-content {
    display: flex;
    gap: 30px;
    align-items: stretch;
    margin-bottom: 40px;
}

/* Зеленая рамка со скидкой */
.discount-frame {
    flex: 1;
    background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 200, 100, 0.05));
    border: 3px solid #00ff88;
    border-radius: 20px;
    padding: 30px;
    position: relative;
    overflow: hidden;
    box-shadow: 
        0 0 30px rgba(0, 255, 136, 0.3),
        inset 0 0 30px rgba(0, 255, 136, 0.1);
    animation: discountPulse 2s ease-in-out infinite;
}

@keyframes discountPulse {
    0%, 100% {
        box-shadow: 
            0 0 30px rgba(0, 255, 136, 0.3),
            inset 0 0 30px rgba(0, 255, 136, 0.1);
    }
    50% {
        box-shadow: 
            0 0 50px rgba(0, 255, 136, 0.5),
            inset 0 0 50px rgba(0, 255, 136, 0.2);
    }
}

/* Анимированные частицы вокруг рамки */
.discount-frame::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    background: linear-gradient(45deg, #00ff88, #00cc66, #00ff88, #00aa55);
    border-radius: 20px;
    opacity: 0;
    z-index: -1;
    animation: borderRotate 3s linear infinite;
}

@keyframes borderRotate {
    0% {
        transform: rotate(0deg);
    }
    100% {
        transform: rotate(360deg);
    }
}

.discount-frame:hover::before {
    opacity: 0.3;
}

.discount-content {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 15px;
}

.discount-icon {
    font-size: 3em;
    animation: bounce 1s ease-in-out infinite;
}

@keyframes bounce {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

.discount-info {
    flex: 1;
}

.discount-percent {
    font-size: 3.5em;
    font-weight: bold;
    color: #00ff88;
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
    line-height: 1;
    margin-bottom: 5px;
}

.discount-text {
    font-size: 1.1em;
    color: #fff;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.discount-description {
    color: #ccc;
    font-size: 1em;
    margin-bottom: 10px;
    text-align: center;
}

.discount-timer {
    text-align: center;
    color: #00ff88;
    font-weight: bold;
    font-size: 0.9em;
}

/* Поиск кейсов */
.search-container {
    width: 400px;
    flex-shrink: 0;
}

.search-input {
    width: 100%;
    padding: 20px 25px;

}

.search-input:focus {

}

        transform: translateY(0) scale(1);
    }
    50% {
        transform: translateY(-10px) scale(1.1);
    }
}

.discount-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.discount-percent {
    font-size: 5em;
    font-weight: 900;
    color: #00ff88;
    text-shadow: 
        0 0 20px rgba(0, 255, 136, 1),
        0 0 40px rgba(0, 255, 136, 0.6),
        2px 2px 0 rgba(0, 0, 0, 0.5);
    line-height: 1;
    margin-bottom: 5px;
    font-family: 'Arial Black', 'Impact', sans-serif;
    letter-spacing: -2px;
}

.discount-label {
    font-size: 1.3em;
    color: #fff;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

.discount-divider {
    width: 2px;
    height: 80px;
    background: linear-gradient(to bottom, transparent, #00ff88, transparent);
    opacity: 0.5;
}

.discount-details {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
}

.discount-description {
    color: #fff;
    font-size: 1.2em;
    font-weight: 600;
    text-align: right;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
}

.discount-timer {
    color: #00ff88;
    font-weight: bold;
    font-size: 1.1em;
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
    font-family: 'Courier New', monospace;
}

/* Поиск кейсов (отдельной строкой) */
.search-row {
    display: flex;
    justify-content: center;
    margin-bottom: 40px;
}

.search-container {
    width: 600px;
    max-width: 100%;
}

.search-input {
    width: 100%;
    padding: 22px 30px;
    font-size: 1.2em;
    background: rgba(15, 20, 25, 0.95);
    border: 2px solid #2a3f54;
    border-radius: 15px;
    color: #fff;
    outline: none;
    transition: all 0.3s;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
    font-weight: 500;
}

.search-input::placeholder {
    color: #888;
    font-weight: 400;
}

.search-input:focus {
    border-color: #ff6b00;
    box-shadow: 
        0 0 30px rgba(255, 107, 0, 0.5),
        0 5px 20px rgba(0, 0, 0, 0.4);
    transform: translateY(-2px);
}

/* Адаптивность */
@media (max-width: 1200px) {
    .discount-content {
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }
    
    .discount-divider {
        display: none;
    }
    
    .discount-details {
        align-items: center;
    }
    
    .discount-description {
        text-align: center;
    }
    
    
    .main-title {
        font-size: 3.5em;
    }
}

@media (max-width: 768px) {
    .promo-header {
        flex-direction: column;
        gap: 15px;
    }
    
    
    .main-title {
        font-size: 2.5em;
    }
    
    .discount-percent {
        font-size: 3.5em;
    }
    
    .discount-icon {
        font-size: 2.5em;
    }
    
    .discount-label {
        font-size: 1em;
    }
    
    .discount-description {
        font-size: 1em;
    }
    
    .search-container {
        width: 100%;
    }
}

.logo-link {
    display: flex;
    align-items: center;
    gap: 15px;
    text-decoration: none;
}

.logo-text {
    display: flex;
    flex-direction: column;
}

.logo-title {
    font-size: 1.8em;
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 2px;
    line-height: 1;
}

.logo-title span {
    color: #ff6b00;
}

.logo-subtitle {
    font-size: 0.7em;
    color: #888;
    letter-spacing: 3px;
    margin-top: 2px;
}
/* ===== НЕОНОВЫЕ ИКОНКИ В ХЕДЕРЕ ===== */

.nav-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    background: rgba(255, 107, 0, 0.1);
    border: 1px solid rgba(255, 107, 0, 0.3);
    transition: all 0.3s ease;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.5px;
}

.nav-btn:hover {
    background: rgba(255, 107, 0, 0.2);
    border-color: rgba(255, 107, 0, 0.6);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
}

.nav-icon-png {
    width: 24px;
    height: 24px;
    filter: drop-shadow(0 0 4px rgba(255, 107, 0, 0.6));
    transition: all 0.3s ease;
}

.nav-btn:hover .nav-icon-png {
    filter: drop-shadow(0 0 10px rgba(255, 107, 0, 1)) brightness(1.2);
    transform: scale(1.1);
}

/* Иконка скидки в промо-секции */
.discount-icon-png {
    width: 150px;
    height: 150px;
    filter: drop-shadow(0 0 8px rgba(255, 107, 0, 0.6));
    animation: discountGlow 2s ease-in-out infinite;
}

@keyframes discountGlow {
    0%, 100% {
        filter: drop-shadow(0 0 8px rgba(255, 107, 0, 0.6));
    }
    50% {
        filter: drop-shadow(0 0 16px rgba(255, 107, 0, 1));
    }
}

/* Адаптивность */
@media (max-width: 768px) {
    .nav-btn span {
        display: none;
    }
    
    .nav-icon-png {
        width: 20px;
        height: 20px;
    }
}

}

/* Выпадающее меню */
.dropdown-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    background: rgba(10, 14, 23, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 107, 0, 0.4);
    border-radius: 12px;
    padding: 8px;
    min-width: 220px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 107, 0, 0.2);

    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.3s ease;

}

    opacity: 1;

    transform: translateY(0);

/* Адаптивность */
@media (max-width: 768px) {
    .nav-icon-png {
        width: 24px;
        height: 24px;
    }
    
    .profile-name {
        display: none;
    }
    
    .dropdown-menu {
        right: -10px;
    }
}

</head>
<body>
    <div class="header-container"></div>
<!-- Секция с акцией и поиском -->
<div class="promo-section">
    <!-- Заголовок с логотипом -->
    <div class="promo-header">
        <img src="/images/logo.png" alt="Mone Drop" class="header-logo">
        <h1 class="main-title">
            <span class="title-mone">Mone</span>
            <span class="title-drop">Drop</span>
        </h1>
    </div>
    
    <!-- Акция в одну строку -->
    <div class="discount-frame">
        <div class="discount-content">
            <img src="/images/icons/icon-discount.png" alt="Discount" class="discount-icon-png">
            <div class="discount-info">
                <div class="discount-percent" id="dailyDiscount">25%</div>
                <div class="discount-label">СКИДКА НА ПОПОЛНЕНИЕ</div>
            </div>
            <div class="discount-divider"></div>
            <div class="discount-details">
                <div class="discount-description">Скидка действует к пополнению именно сегодня</div>
                <div class="discount-timer" id="discountTimer"></div>
            </div>
        </div>
    </div>
    
    <!-- Поиск кейсов (отдельной строкой ниже) -->
    <div class="search-row">
        <div class="search-container">
            <input 
                type="text" 
                id="caseSearch" 
                placeholder="🔍 Поиск кейсов по названию..." 
                class="search-input"
            >
        </div>
    </div>
</div>

<div class="cases-page">
    <div class="cases-content">
        <div id="casesContainer"></div>
    </div>
    <div class="mascot-container" id="mascotContainer">
        <img src="/images/mascot.png" alt="Mascot" class="mascot-image">
    </div>
</div>
    <!-- ПРАВИЛЬНЫЙ ИМПОРТ ВСЕГО ИЗ data.js -->
    <script type="module">
    import { auth } from '/js/auth.js';
    import { casesData } from '/js/data.js';

    // ==========================================
    // ЕЖЕДНЕВНАЯ СКИДКА
    // ==========================================
    function getDailyDiscount() {
        const today = new Date();
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
        const discount = 5 + (dayOfYear % 31);
        return discount;
    }

    function updateDiscountTimer() {
        const now = new Date();
        const tomorrow = new Date(now);
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(0, 0, 0, 0);
        
        const diff = tomorrow - now;
        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        
        const timerElement = document.getElementById('discountTimer');
        if (timerElement) {
            timerElement.textContent = `До конца акции: ${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
    }

    const dailyDiscount = getDailyDiscount();
    const discountElement = document.getElementById('dailyDiscount');
    if (discountElement) {
        discountElement.textContent = dailyDiscount + '%';
    }

    updateDiscountTimer();
    setInterval(updateDiscountTimer, 1000);

    // ==========================================
    // РАЗБЛОКИРОВКА РАЗДЕЛОВ ПО УРОВНЯМ
    // ==========================================
    const sectionUnlockLevels = {
        1: 1,   // ROBERO — доступен с 1 уровня
        2: 5,   // ROBERO PRO — с 5 уровня
        3: 9,   // ELITE SAILOOP — с 9 уровня
        4: 13,  // ELITE SAILOOP PRO — с 13 уровня
        5: 17,  // LEGENDARY — с 17 уровня
        6: 21,  // MYSTIC — с 21 уровня
        7: 25   // GODLIKE — с 25 уровня
    };

    function isSectionUnlocked(sectionNum, userLevel) {
        const requiredLevel = sectionUnlockLevels[sectionNum] || 999;
        return userLevel >= requiredLevel;
    }
function renderCases() {
    const userLevel = auth.user?.level || 1;
    const container = document.getElementById('casesContainer');
    container.innerHTML = '';
    
    // Формула: каждые 5 уровней = +5 кейсов
    // Уровень 1-5: 5 кейсов
    // Уровень 6-10: 10 кейсов
    // Уровень 11-15: 15 кейсов
    // И так далее...
    const totalCasesToShow = Math.floor((userLevel - 1) / 5) * 5 + 5;
    
    console.log(`[INFO] Уровень: ${userLevel}, Показываем кейсов: ${totalCasesToShow}`);
    
    // Собираем все кейсы из всех разделов в один массив
    const allCases = [];
    Object.entries(casesData).forEach(([sectionKey, section]) => {
        section.cases.forEach(caseInfo => {
            allCases.push({ ...caseInfo, sectionName: section.name });
        });
    });
    
    // Берем только нужное количество кейсов
    const casesToShow = allCases.slice(0, totalCasesToShow);
    
    // Группируем кейсы по разделам для отображения
    const casesBySection = {};
    casesToShow.forEach(caseInfo => {
        if (!casesBySection[caseInfo.sectionName]) {
            casesBySection[caseInfo.sectionName] = [];
        }
        casesBySection[caseInfo.sectionName].push(caseInfo);
    });
    
    // Рендерим разделы
    Object.entries(casesBySection).forEach(([sectionName, cases]) => {
        const sectionEl = document.createElement('div');
        sectionEl.className = 'cases-section';
        
        const headerEl = document.createElement('div');
        headerEl.className = 'section-header';
        headerEl.innerHTML = `
            <h2 class="section-title">${sectionName}</h2>
        `;
        sectionEl.appendChild(headerEl);
        
        const gridEl = document.createElement('div');
        gridEl.className = 'cases-grid';
        
        cases.forEach(caseInfo => {
            let rarity = 'cheap';
            if (caseInfo.price >= 500 && caseInfo.price < 2000) rarity = 'mid';
            else if (caseInfo.price >= 2000 && caseInfo.price < 10000) rarity = 'expensive';
            else if (caseInfo.price >= 10000) rarity = 'legendary';
            
            const caseCard = document.createElement('div');
            caseCard.className = 'case-card';
            caseCard.setAttribute('data-rarity', rarity);
            caseCard.onclick = () => window.location.href = `/case-detail?id=${caseInfo.id}`;
            
            caseCard.innerHTML = `
                ${caseInfo.oldPrice ? `<div class="case-sale-badge">-${Math.round((1 - caseInfo.price / caseInfo.oldPrice) * 100)}%</div>` : ''}
                <div class="case-name">${caseInfo.name}</div>
                <div class="case-image">
                    ${caseInfo.image 
                        ? `<img src="${caseInfo.image}" alt="${caseInfo.name}" class="case-img">` 
                        : `<span style="font-size: 4em; z-index: 3;">${caseInfo.icon || ''}</span>`}
                </div>
                <div class="case-info">${caseInfo.itemsCount || 42} предметов</div>
                ${caseInfo.oldPrice ? `<span class="case-old-price">${caseInfo.oldPrice} mon</span>` : ''}
                <span class="case-price">${caseInfo.price} mon</span>
            `;
            
            gridEl.appendChild(caseCard);
        });
        
        sectionEl.appendChild(gridEl);
        container.appendChild(sectionEl);
    });
    
    // Показываем заблокированные разделы (если есть)
    const totalAvailableCases = allCases.length;
    if (totalCasesToShow < totalAvailableCases) {
        const nextUnlockLevel = Math.floor(totalCasesToShow / 5) * 5 + 6;
        
        const lockedSection = document.createElement('div');
        lockedSection.className = 'cases-section locked-section';
        
        const lockedOverlay = document.createElement('div');
        lockedOverlay.className = 'locked-overlay';
        lockedOverlay.innerHTML = `
            <div class="lock-icon">🔒</div>
            <div class="lock-title">Следующие кейсы заблокированы</div>
            <div class="lock-text">Доступно с уровня ${nextUnlockLevel}</div>
            <div class="lock-hint">Продолжай открывать кейсы, чтобы получить XP и разблокировать больше контента!</div>
        `;
        
        lockedSection.appendChild(lockedOverlay);
        container.appendChild(lockedSection);
    }
}
    // ПОИСК КЕЙСОВ
    // ==========================================
    const searchInput = document.getElementById('caseSearch');
    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const caseCards = document.querySelectorAll('.case-card');
            
            caseCards.forEach(card => {
                const caseName = card.querySelector('.case-name').textContent.toLowerCase();
                if (caseName.includes(searchTerm)) {
                    card.style.display = 'flex';
                    card.style.animation = 'fadeIn 0.3s ease';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    }

    // Добавляем анимацию fadeIn
    const style = document.createElement('style');
    style.textContent = `
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ===== ЗАБЛОКИРОВАННЫЕ РАЗДЕЛЫ ===== */
        .locked-section {
            margin-bottom: 40px;
            padding: 60px 40px;
            background: rgba(15, 20, 25, 0.5);
            border: 2px dashed rgba(255, 68, 68, 0.3);
            border-radius: 20px;
            position: relative;
            text-align: center;
        }
        
        .locked-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .lock-icon {
            font-size: 64px;
            filter: drop-shadow(0 0 20px rgba(255, 68, 68, 0.6));
            animation: lockPulse 2s ease-in-out infinite;
        }
        
        @keyframes lockPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        
        .lock-title {
            font-size: 24px;
            font-weight: bold;
            color: #ff4444;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .lock-text {
            font-size: 16px;
            color: #ff6b00;
            font-weight: 600;
        }
        
        .lock-hint {
            font-size: 14px;
            color: #888;
            max-width: 400px;
            line-height: 1.5;
        }
    `;
    document.head.appendChild(style);

    // ==========================================
    // МАСКОТ АНИМАЦИЯ
    // ==========================================
    const mascotContainer = document.getElementById('mascotContainer');
    if (mascotContainer) {
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const fadeStart = 50;
            const fadeEnd = 400;
            
            if (scrollY < fadeStart) {
                mascotContainer.style.opacity = '1';
                mascotContainer.style.transform = 'translate(-50%, -50%) scale(1)';
            } else if (scrollY > fadeEnd) {
                mascotContainer.style.opacity = '0';
                mascotContainer.style.transform = 'translate(-50%, 100%) scale(0.8)';
            } else {
                const fadeProgress = (scrollY - fadeStart) / (fadeEnd - fadeStart);
                mascotContainer.style.opacity = 1 - fadeProgress;
                const moveDown = fadeProgress * 150;
                const scale = 1 - (fadeProgress * 0.2);
                mascotContainer.style.transform = `translate(-50%, calc(-50% + ${moveDown}px)) scale(${scale})`;
            }
        });
    }

    // ==========================================
    // ЗАПУСК ПРИ ЗАГРУЗКЕ
    // ==========================================
    async function initCasesPage() {
        await auth.loadUser();
        const userLevel = auth.user?.level || 1;
        console.log(`[INFO] Загрузка кейсов. Уровень пользователя: ${userLevel}`);
        renderCases();
    }

    initCasesPage();
</script>
