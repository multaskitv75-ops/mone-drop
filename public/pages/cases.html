<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Апгрейдер - Mone Drop</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a0e17;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Фоновый узор как на сайте */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 107, 0, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 212, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .maintenance-card {
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 107, 0, 0.3);
            border-radius: 24px;
            padding: 60px 50px;
            text-align: center;
            max-width: 550px;
            width: 90%;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 0 60px rgba(255, 107, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: cardAppear 0.6s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Неоновая линия сверху */
        .maintenance-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #ff6b00 20%, 
                #00d4ff 50%, 
                #ff6b00 80%, 
                transparent 100%
            );
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.5);
        }

        /* Иконка шестерёнки */
        .maintenance-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            position: relative;
            animation: rotateGear 8s linear infinite;
        }

        .maintenance-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(255, 107, 0, 0.6));
        }

        @keyframes rotateGear {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .maintenance-title {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 107, 0, 0.5);
        }

        .maintenance-title span {
            background: linear-gradient(135deg, #ff6b00, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .maintenance-text {
            font-size: 16px;
            color: #888;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        /* Анимированные точки */
        .dots {
            display: inline-flex;
            gap: 6px;
            margin-left: 5px;
        }

        .dots span {
            width: 8px;
            height: 8px;
            background: #ff6b00;
            border-radius: 50%;
            animation: dotPulse 1.4s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(255, 107, 0, 0.6);
        }

        .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotPulse {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Кнопка */
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 35px;
            background: linear-gradient(135deg, #ff6b00 0%, #ff8c00 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 25px rgba(255, 107, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-home::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-home:hover::before {
            left: 100%;
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(255, 107, 0, 0.6);
        }

        /* Статус бар */
        .status-bar {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff6b00;
            box-shadow: 0 0 10px rgba(255, 107, 0, 0.6);
            animation: statusPulse 2s ease-in-out infinite;
        }

        .status-dot.green {
            background: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <!-- Иконка шестерёнки -->
        <div class="maintenance-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 30 L55 20 L60 30 L70 30 L65 40 L75 45 L65 50 L70 60 L60 55 L55 65 L50 55 L45 65 L40 55 L30 60 L35 50 L25 45 L35 40 L30 30 L40 30 L45 20 L50 30Z" 
                      stroke="#ff6b00" stroke-width="2" fill="rgba(255, 107, 0, 0.1)"/>
                <circle cx="50" cy="45" r="12" stroke="#00d4ff" stroke-width="2" fill="rgba(0, 212, 255, 0.1)"/>
            </svg>
        </div>

        <h1 class="maintenance-title">Временные <span>тех. работы</span></h1>
        
        <p class="maintenance-text">
            Мы улучшаем апгрейдер для вас
            <span class="dots">
                <span></span><span></span><span></span>
            </span>
            <br>
            Скоро здесь появится новый функционал
        </p>

        <a href="/" class="btn-home">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M3 12l9-9 9 9M5 10v10h14V10"/>
            </svg>
            На главную
        </a>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot"></div>
                <span>Сервер</span>
            </div>
            <div class="status-item">
                <div class="status-dot green"></div>
                <span>Кейсы</span>
            </div>
            <div class="status-item">
                <div class="status-dot green"></div>
                <span>Магазин</span>
            </div>
        </div>
    </div>
</body>
</html>
