<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - CaseBattle</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/icons.css">
</head>
<body>
    <!-- SVG Sprite -->
<svg style="display: none;">
    <symbol id="icon-upgrade" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="12" fill="#FFC107"/>
        <path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z" fill="#000"/>
    </symbol>
    <symbol id="icon-cases" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="12" fill="#FFC107"/>
        <path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z" fill="#000"/>
    </symbol>
    <symbol id="icon-shop" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="12" fill="#FFC107"/>
        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" fill="#000"/>
    </symbol>
</svg>
    <div class="login-container">
        <div class="login-logo">CASE<span>BATTLE</span></div>
        <div class="login-subtitle">У НАС ВЫИГРЫВАЮТ</div>
        
        <!-- КНОПКА STEAM -->
        <a href="/api/auth/steam" class="steam-login-btn">
            <svg class="steam-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.083 1.106-.127 1.676-.127.063 0 .125.002.188.003l2.861-4.142V9.4c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 12.001-5.373 12.001-12S18.606 0 11.979 0zM7.54 18.21l-1.473-.61c.262.543.714.999 1.314 1.25 1.297.539 2.793-.076 3.332-1.375.263-.63.264-1.319.005-1.949s-.75-1.121-1.377-1.383c-.624-.26-1.29-.249-1.878-.03l1.523.63c.956.4 1.409 1.5 1.009 2.455-.397.957-1.497 1.41-2.454 1.012H7.54zm11.16-8.807c0-1.662-1.353-3.015-3.015-3.015-1.665 0-3.015 1.353-3.015 3.015 0 1.665 1.35 3.015 3.015 3.015 1.663 0 3.015-1.35 3.015-3.015zm-5.273-.005c0-1.252 1.013-2.266 2.265-2.266 1.249 0 2.266 1.014 2.266 2.266 0 1.251-1.017 2.265-2.266 2.265-1.253 0-2.265-1.014-2.265-2.265z"/>
            </svg>
            ВОЙТИ ЧЕРЕЗ STEAM
        </a>

        <div class="divider">
            <span>ИЛИ</span>
        </div>
        
        <form id="loginForm" class="login-form">
            <input type="text" id="username" placeholder="Имя пользователя" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit" class="login-btn">ВОЙТИ</button>
        </form>

        <div id="loginError" class="error-message"></div>

        <div class="login-footer">
            Нет аккаунта? <a href="/register">Зарегистрироваться</a>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
    <script type="module">
    import { auth } from '/js/auth.js';
     document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('loginError');
        
        errorDiv.textContent = '';
        
        const result = await auth.login(username, password);
        
        if (result.success) {
            window.location.href = '/';
        } else {
            errorDiv.textContent = result.error;
        }
    });
</script>
</body>
</html>
