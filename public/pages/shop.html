    <script type="module" src="/js/main.js">
        // Загрузка ленты дропов
async function loadDropsFeed() {
    const dropsFeed = document.getElementById('dropsFeed');
    if (!dropsFeed) return;
    
    try {
        const response = await fetch('/api/drops');
        const drops = await response.json();
        
        if (drops.length === 0) {
            // Демо-дропы если нет реальных
            dropsFeed.innerHTML = `
                <div class="drop-item">
                    <span style="font-size: 2em;">🎁</span>
                    <div>
                        <div class="drop-username">Система</div>
                        <div class="drop-skin-name">Начни открывать кейсы!</div>
                    </div>
                </div>
            `;
            return;
        }
        
        // Дублируем для бесконечной прокрутки
        const dropsHTML = drops.map(drop => `
            <div class="drop-item">
                ${drop.skin.image ? `<img src="${drop.skin.image}" alt="${drop.skin.name}">` : '<span style="font-size: 2em;"></span>'}
                <div>
                    <div class="drop-username">${drop.username}</div>
                    <div class="drop-skin-name">${drop.skin.name}</div>
                    <div class="drop-skin-price">${drop.skin.price.toFixed(2)}  mon</div>
                </div>
            </div>
        `).join('');
        
        dropsFeed.innerHTML = dropsHTML + dropsHTML; // Дублируем для плавной прокрутки
        
    } catch (error) {
        console.error('Ошибка загрузки дропов:', error);
    }
}

// Загружаем дропы при загрузке страницы
loadDropsFeed();

// Обновляем каждые 10 секунд
setInterval(loadDropsFeed, 10000);
    </script>
    <script src="/js/load-header.js"></script>
<script type="module">
    import { auth } from '/js/auth.js';
    import { skins, rarityColors } from '/js/data.js';

    // Функция загрузки и отображения инвентаря
    async function loadInventory() {
        const inventoryGrid = document.getElementById('inventoryGrid');
        if (!inventoryGrid) return;

        try {
            // Получаем данные пользователя с инвентарем
            const response = await fetch('/api/auth/me', {
                headers: { 
                    'Authorization': `Bearer ${auth.token}` 
                }
            });
            
            const data = await response.json();
            
            if (!data.user || !data.user.inventory || data.user.inventory.length === 0) {
                inventoryGrid.innerHTML = '<div class="empty-inventory">Инвентарь пуст — откройте кейсы!</div>';
                return;
            }

            // Очищаем контейнер
            inventoryGrid.innerHTML = '';

            // Отображаем каждый предмет
            data.user.inventory.forEach(item => {
                const itemCard = createInventoryItemCard(item);
                inventoryGrid.appendChild(itemCard);
            });

        } catch (error) {
            console.error('Ошибка загрузки инвентаря:', error);
            inventoryGrid.innerHTML = '<div class="error">Ошибка загрузки инвентаря</div>';
        }
    }

    // Создание карточки предмета
    function createInventoryItemCard(item) {
        const card = document.createElement('div');
        card.className = 'inventory-item';
        
        const borderColor = rarityColors[item.rarity] || '#fff';
        
        card.innerHTML = `
            <div class="inventory-item-image" style="border-top: 3px solid ${borderColor}">
                ${item.image ? `
                    <img src="${item.image}" 
                         alt="${item.name}" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="inventory-item-icon" style="display:none; font-size: 4em;">🔫</div>
                ` : `
                    <div class="inventory-item-icon" style="font-size: 4em;">🔫</div>
                `}
            </div>
            <div class="inventory-item-name">${item.name}</div>
            <div class="inventory-item-price">${item.price.toFixed(2)}  mon</div>
            <button class="inventory-item-sell" onclick="sellInventoryItem(${item.uniqueId}, ${item.price})">
                ПРОДАТЬ
            </button>
        `;
        
        return card;
    }

    // Продажа предмета из инвентаря
    window.sellInventoryItem = async function(uniqueId, price) {
        if (!confirm(`Продать скин за ${price.toFixed(2)}  mon?`)) return;

        try {
            const response = await fetch('/api/auth/sell-skin', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${auth.token}`
                },
                body: JSON.stringify({ uniqueId })
            });

            const data = await response.json();

            if (response.ok) {
                // Обновляем баланс в хедере
                if (typeof auth !== 'undefined') {
                    auth.user.balance = data.balance;
                    auth.user.inventory = data.inventory;
                    localStorage.setItem('user', JSON.stringify(auth.user));
                    auth.updateUI();
                }
                
                // Перезагружаем инвентарь
                await loadInventory();
                
                showNotification(`Скин продан за ${price.toFixed(2)}  mon`, 'success');
            } else {
                throw new Error(data.error);
            }
        } catch (error) {
            console.error('Ошибка продажи:', error);
            showNotification('Ошибка продажи скина', 'error');
        }
    };

    // Уведомления
    function showNotification(message, type = 'info') {
        const notif = document.createElement('div');
        notif.className = `notification ${type}`;
        notif.textContent = message;
        notif.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: ${type === 'success' ? '#00ff88' : '#ff4444'};
            color: #000;
            border-radius: 8px;
            font-weight: bold;
            z-index: 10000;
            animation: slideIn 0.3s ease;
        `;
        document.body.appendChild(notif);
        
        setTimeout(() => {
            notif.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => notif.remove(), 300);
        }, 3000);
    }

    // Загружаем инвентарь при загрузке страницы
    document.addEventListener('DOMContentLoaded', () => {
        if (auth.isAuthenticated()) {
            loadInventory();
        }
    });
</script>

<style>
    /* Стили для инвентаря */
    .skins-grid {

    }

    .inventory-item-sell {

        padding: 10px;
        background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
        border: none;
        border-radius: 8px;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.5px;
    }

    .inventory-item-sell:hover {
        background: linear-gradient(135deg, #ff6666 0%, #ff4444 100%);
        box-shadow: 0 4px 15px rgba(255, 68, 68, 0.4);
        transform: translateY(-2px);
    }

    .empty-inventory {
        text-align: center;
        padding: 60px 20px;
        color: #888;
        font-size: 18px;
        grid-column: 1 / -1;
    }

    @keyframes slideIn {
        from {
            transform: translateX(400px);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }

    @keyframes slideOut {
        from {
            transform: translateX(0);
            opacity: 1;
        }
        to {
            transform: translateX(400px);
            opacity: 0;
        }
    }
</style>
